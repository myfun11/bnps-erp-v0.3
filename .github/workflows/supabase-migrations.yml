name: Supabase migrations (manual, guarded)

on:
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: "Apply reviewed SQL migrations to the linked Supabase project"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  migrate:
    name: Validate and optionally apply Supabase migrations
    runs-on: ubuntu-latest
    environment: supabase-production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require reviewed Supabase migration files
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/config.toml
          if ! compgen -G 'supabase/migrations/*.sql' > /dev/null; then
            echo "::error::No versioned SQL files found in supabase/migrations/. Audit and reconcile the live Supabase migration history before importing existing database/*.sql files."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify credentials and inspect migration history
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN secret"; exit 1; }
          test -n "${SUPABASE_PROJECT_REF:-}" || { echo "::error::Missing SUPABASE_PROJECT_REF secret"; exit 1; }
          test -n "${SUPABASE_DB_PASSWORD:-}" || { echo "::error::Missing SUPABASE_DB_PASSWORD secret"; exit 1; }
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase migration list

      - name: Apply reviewed migrations only when explicitly approved
        if: ${{ inputs.apply_migrations == true }}
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --yes

      - name: Validation-only run
        if: ${{ inputs.apply_migrations != true }}
        run: echo "Validation-only run completed. No database migrations were applied."
