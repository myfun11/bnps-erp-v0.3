name: KYC Source Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "database/15_kyc_ocr_and_atomic_conversion.sql"
      - "supabase/functions/**"
      - "src/**"
      - "package.json"
      - "vite.config.*"
      - ".github/workflows/kyc-source-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend TypeScript and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm run lint
      - run: npm run build

  edge-functions:
    name: Supabase Edge Function typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/verify-kyc-document/index.ts
      - run: deno check supabase/functions/change-initial-password/index.ts
      - run: deno check supabase/functions/create-agent/index.ts

  sql-parse:
    name: PostgreSQL migration parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pglast
      - name: Parse migration SQL
        run: python -c "from pathlib import Path; from pglast import parse_sql; p=Path('database/15_kyc_ocr_and_atomic_conversion.sql'); parse_sql(p.read_text()); print(f'Parsed {p} successfully')"

  sql-runtime:
    name: Disposable PostgreSQL migration execution
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bnps_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bnps_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create disposable BNPS schema fixture
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d bnps_test -v ON_ERROR_STOP=1 -f tests/sql/kyc_migration_fixture.sql
      - name: Execute migration against disposable fixture only
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d bnps_test -v ON_ERROR_STOP=1 -f database/15_kyc_ocr_and_atomic_conversion.sql
      - name: Assert post-migration grants and schema
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d bnps_test -v ON_ERROR_STOP=1 -f tests/sql/assert_kyc_migration.sql
