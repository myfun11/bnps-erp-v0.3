name: KYC Source Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "database/15_kyc_ocr_and_atomic_conversion.sql"
      - "database/16_test_agent_mode_guardrails.sql"
      - "database/17_atomic_test_agent_creation.sql"
      - "database/18_harden_sensitive_views.sql"
      - "database/19_restrict_legacy_create_agent_rpc.sql"
      - "database/20_unlimited_admin_agent_hierarchy.sql"
      - "supabase/functions/**"
      - "src/**"
      - "tests/sql/**"
      - "package.json"
      - "vite.config.*"
      - ".github/workflows/kyc-source-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend TypeScript and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm run lint
      - run: npm run build

  edge-functions:
    name: Supabase Edge Function typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/verify-kyc-document/index.ts
      - run: deno check supabase/functions/change-initial-password/index.ts
      - run: deno check supabase/functions/create-agent/index.ts
      - run: deno check supabase/functions/reset-agent-password/index.ts

  sql-parse:
    name: PostgreSQL migration parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pglast
      - name: Parse migration SQL
        run: python -c "from pathlib import Path; from pglast import parse_sql; files=[Path('database/15_kyc_ocr_and_atomic_conversion.sql'),Path('database/16_test_agent_mode_guardrails.sql'),Path('database/17_atomic_test_agent_creation.sql'),Path('database/18_harden_sensitive_views.sql'),Path('database/19_restrict_legacy_create_agent_rpc.sql'),Path('database/20_unlimited_admin_agent_hierarchy.sql'),Path('tests/sql/assert_agent_hierarchy_migration.sql')]; [parse_sql(p.read_text()) for p in files]; print('Parsed '+', '.join(str(p) for p in files)+' successfully')"

  sql-runtime:
    name: Disposable PostgreSQL migration execution
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bnps_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bnps_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create disposable BNPS schema fixture
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d bnps_test -v ON_ERROR_STOP=1 -f tests/sql/kyc_migration_fixture.sql
      - name: Execute migration against disposable fixture only
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d bnps_test -v ON_ERROR_STOP=1 -f database/15_kyc_ocr_and_atomic_conversion.sql
          psql -h 127.0.0.1 -U postgres -d bnps_test -v ON_ERROR_STOP=1 -f database/16_test_agent_mode_guardrails.sql
          psql -h 127.0.0.1 -U postgres -d bnps_test -v ON_ERROR_STOP=1 -f database/17_atomic_test_agent_creation.sql
          psql -h 127.0.0.1 -U postgres -d bnps_test -v ON_ERROR_STOP=1 -f database/18_harden_sensitive_views.sql
          psql -h 127.0.0.1 -U postgres -d bnps_test -v ON_ERROR_STOP=1 -f database/19_restrict_legacy_create_agent_rpc.sql
          psql -h 127.0.0.1 -U postgres -d bnps_test -v ON_ERROR_STOP=1 -f database/20_unlimited_admin_agent_hierarchy.sql
      - name: Assert >10-level hierarchy, wrapper authorization, and delegate contract on disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d bnps_test -v ON_ERROR_STOP=1 -f tests/sql/assert_agent_hierarchy_migration.sql
      - name: Assert post-migration grants and schema
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d bnps_test -v ON_ERROR_STOP=1 -f tests/sql/assert_kyc_migration.sql
