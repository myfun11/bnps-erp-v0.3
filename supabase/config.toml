# Supabase CLI configuration for BNPS ERP v0.3.
# Production project ref and credentials are provided through GitHub Environment secrets.
# Do not store credentials or customer data in this file.
project_id = "bnps-erp-v0-3"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 15

[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = true
